databases:
  - name: supportdesk-db
    plan: free
services:
  - type: web
    name: supportdesk-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://supportdesk-web.onrender.com
  - type: web
    name: supportdesk-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://supportdesk-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
